[project]
name = "beatbh"
version = "1.0.0"
description = "Can econometric forecasts beat buy & hold? A walk-forward backtest with statistical tests."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joan Gordó Guardia" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore"]
